# Copy to /etc/nginx/sites-available/decal on the server, replace
# decal.yourdomain.com with your real domain, then:
#
#   sudo ln -s /etc/nginx/sites-available/decal /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d decal.yourdomain.com
#
# certbot rewrites this file to add the HTTPS server block, cert paths,
# and an http->https redirect — you only need to hand-write the plain-http
# version below. This runs alongside whatever server block already serves
# Pterodactyl (a different server_name, so nginx routes between them by
# the Host header — no conflict on 80/443, they're just two vhosts on the
# same nginx).
server {
    listen 80;
    listen [::]:80;
    server_name decal.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Real-time family sync (chores/calendar/notes updating live across
        # devices) uses long-lived Server-Sent Events connections —
        # buffering would delay/batch those events, and nginx's default
        # 60s read timeout would silently kill an idle one.
        proxy_buffering off;
        proxy_read_timeout 1d;
    }
}
