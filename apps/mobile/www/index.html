<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Decal</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: #14171d;
        color: #ede9e1;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
      }
      .card {
        width: 100%;
        max-width: 380px;
        text-align: center;
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #f0633d;
        margin: 0 0 8px;
      }
      h1 {
        font-size: 26px;
        font-weight: 600;
        margin: 0 0 12px;
      }
      p.copy {
        color: #8a8f9c;
        font-size: 14px;
        line-height: 1.6;
        margin: 0 0 24px;
      }
      input {
        width: 100%;
        background: #1c1f26;
        border: 1px solid rgba(237, 233, 225, 0.16);
        border-radius: 10px;
        padding: 14px 14px;
        color: #ede9e1;
        font-size: 15px;
        margin-bottom: 12px;
      }
      button {
        width: 100%;
        background: #f0633d;
        color: #14171d;
        border: none;
        border-radius: 999px;
        padding: 14px 20px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
      }
      .error {
        color: #f0633d;
        font-size: 13px;
        margin: 12px 0 0;
        display: none;
      }
      .loading {
        display: none;
      }
      .loading p {
        color: #8a8f9c;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="card" id="form-card">
      <p class="eyebrow">Decal</p>
      <h1>Connect to your family's server</h1>
      <p class="copy">
        Enter the address of your self-hosted Decal server — the same one you'd type into a
        browser at home. You can find it in the desktop dashboard, or ask whoever set it up.
      </p>
      <input
        id="server-url"
        type="url"
        inputmode="url"
        autocapitalize="off"
        autocorrect="off"
        placeholder="https://decal.yourhouse.com"
      />
      <button id="connect-button" type="button">Connect</button>
      <p class="error" id="error-text"></p>
    </div>
    <div class="card loading" id="loading-card">
      <p class="eyebrow">Decal</p>
      <p>Connecting&hellip;</p>
    </div>

    <script>
      // Capacitor auto-injects `window.Capacitor` (and every registered
      // plugin under `Capacitor.Plugins`) into this WebView at runtime —
      // no npm install/bundler needed for this bootstrap page specifically,
      // it's plain static HTML shipped as the app's local webDir.
      var Preferences = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences;
      var PREF_KEY = "decal_server_url";

      function normalizeUrl(raw) {
        var value = raw.trim().replace(/\/+$/, "");
        if (!/^https?:\/\//i.test(value)) value = "https://" + value;
        return value;
      }

      function goToServer(url) {
        document.getElementById("form-card").style.display = "none";
        document.getElementById("loading-card").style.display = "block";
        // The mobile-optimized route (bottom-tab shell), not "/" — that's
        // the kiosk dashboard's side-by-side desktop layout.
        window.location.href = url + "/m";
      }

      async function tryStoredUrl() {
        if (!Preferences) return; // running in a plain desktop browser preview, not the native app
        var result = await Preferences.get({ key: PREF_KEY });
        if (result && result.value) goToServer(result.value);
      }

      async function connect() {
        var input = document.getElementById("server-url");
        var errorEl = document.getElementById("error-text");
        errorEl.style.display = "none";
        var url = normalizeUrl(input.value);
        if (!input.value.trim()) {
          errorEl.textContent = "Enter your server's address first.";
          errorEl.style.display = "block";
          return;
        }
        if (Preferences) {
          await Preferences.set({ key: PREF_KEY, value: url });
        }
        goToServer(url);
      }

      document.getElementById("connect-button").addEventListener("click", connect);
      document.getElementById("server-url").addEventListener("keydown", function (e) {
        if (e.key === "Enter") connect();
      });

      tryStoredUrl();
    </script>
  </body>
</html>
