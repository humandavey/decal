<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Decal</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: #14171d;
        color: #ede9e1;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
      }
      .card {
        width: 100%;
        max-width: 380px;
        text-align: center;
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #f0633d;
        margin: 0 0 8px;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0 0 12px;
      }
      p.copy {
        color: #8a8f9c;
        font-size: 14px;
        line-height: 1.6;
        margin: 0 0 4px;
      }
      code {
        display: block;
        margin-top: 16px;
        background: #1c1f26;
        border: 1px solid rgba(237, 233, 225, 0.16);
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 13px;
        text-align: left;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <!--
      This page only ever shows up if the app was built without
      DECAL_SERVER_URL set (see apps/mobile/.env.example). In a normal
      build, capacitor.config.ts sets `server.url` to your Decal server, so
      Capacitor loads that origin directly at launch instead of this file —
      there is nothing to click through or connect here at runtime anymore.

      (An earlier version of this app asked for the server address on this
      screen and navigated to it from here. That doesn't work: Capacitor
      treats a navigation to a different origin than the app's configured
      one as "external" and hands it to Safari/Chrome instead of loading it
      in the WebView — which is exactly the "opens Safari, then gets stuck
      on Connecting" bug this build-time approach fixes.)
    -->
    <div class="card">
      <p class="eyebrow">Decal</p>
      <h1>Server address not set</h1>
      <p class="copy">
        This build wasn't given a server to point at. On the machine you build this app from:
      </p>
      <code>cd apps/mobile<br />cp .env.example .env&nbsp;&nbsp;# then edit DECAL_SERVER_URL<br />npx cap sync<br /># rebuild in Xcode / Android Studio</code>
    </div>
  </body>
</html>
